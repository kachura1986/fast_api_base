[project]
name = "fast-api"
version = "0.1.0"
description = "FastAPI"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
back = [
    "fastapi==0.162.2",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "tenacity==9.2.1",
    "uvicorn==0.54.0",
]

lint = [
    "ruff",
    "mypy",
]

test = [
    "pytest",
    "pytest-asyncio",
    "httpx2>=2.0"
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "regression: regression tests for previously fixed bugs",
    "invariant: property-style invariant checks",
    "integration: touches real filesystem / structlog configuration",
]