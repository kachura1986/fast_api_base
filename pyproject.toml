[project]
name = "fast-api"
version = "0.1.0"
description = "FastAPI"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # API dependencies
    "fastapi==0.146.0",
    "pydantic-settings==2.16.1",
    "tenacity==9.2.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
lint = [
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
show_error_codes = true
pretty = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = true
